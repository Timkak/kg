name: Build Any Lab

on:
  workflow_dispatch:
    inputs:
      lab_folder:
        description: 'Какую лабу собрать:'
        required: true
        default: 'lab3'
        type: choice
        options:
          - lab1
          - lab2
          - lab3
          - lab4
      release_tag:
        description: 'Название релиза / тега (например, v3.0):'
        required: true
        default: 'v3.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller
          # Если есть requirements.txt — ставим из него, иначе ставим PyQt6 и OpenCV
          if (Test-Path "${{ inputs.lab_folder }}/requirements.txt") {
            pip install -r ${{ inputs.lab_folder }}/requirements.txt
          } else {
            pip install PyQt6 opencv-python numpy
          }

      - name: Build Executable
        run: |
          cd ${{ inputs.lab_folder }}
          pyinstaller --onefile --windowed --name="${{ inputs.lab_folder }}_App" main.py

      # 1. Загрузка во временные артефакты вкладки Actions
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.lab_folder }}_Windows_Executable
          path: ${{ inputs.lab_folder }}/dist/${{ inputs.lab_folder }}_App.exe

      # 2. Создание полноценного релиза на странице GitHub Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Release ${{ inputs.release_tag }} (${{ inputs.lab_folder }})
          files: ${{ inputs.lab_folder }}/dist/${{ inputs.lab_folder }}_App.exe
          draft: false
          prerelease: false