name: Build Any Lab

on:
  workflow_dispatch:
    inputs:
      lab_folder:
        description: 'Choose which lab to build:'
        required: true
        default: 'lab2'
        type: choice
        options:
          - lab1
          - lab2
          - lab3
          - lab4

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller
          # Installs specific requirements if the file exists
          if (Test-Path "${{ inputs.lab_folder }}/requirements.txt") {
            pip install -r ${{ inputs.lab_folder }}/requirements.txt
          }

      - name: Build Executable
        run: |
          cd ${{ inputs.lab_folder }}
          pyinstaller --onefile --windowed --name="${{ inputs.lab_folder }}_App" main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.lab_folder }}_Windows_Executable
          path: ${{ inputs.lab_folder }}/dist/${{ inputs.lab_folder }}_App.exe