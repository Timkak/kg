name: Build Windows Executable

on:
  push:
    branches: [ "**" ] # Собирает при любом пуше
  workflow_dispatch:   # Позволяет запустить сборку вручную кнопкой

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 opencv-python numpy pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name="Lab2_App" main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lab2_Windows_Executable
          path: dist/Lab2_App.exe
